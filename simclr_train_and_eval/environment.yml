name: pytorch_env
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.8
  - pytorch=1.13.0
  - torchvision=0.14.0
  - pytorch-cuda=11.7
  - numpy=1.23.5
  - pandas=1.5.3
  - scikit-learn=1.2.2
  - scipy=1.10.1
  - pillow=9.4.0
  - tqdm=4.65.0
  - pyyaml=6.0
  - ipython=8.12.0
  - pip
  - pip:
    - exman
    - tabulate
    - configargparse
    - diffdist==0.1